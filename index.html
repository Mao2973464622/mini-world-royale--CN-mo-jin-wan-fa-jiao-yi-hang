<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>摸金交易行 · 涨跌看板</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<!-- ======================= 顶部（紧凑） ======================= -->
<header class="app-header">

  <!-- 行1：标题 + 操作 -->
  <div class="hd-row">
    <h1>摸金交易行 · 涨跌看板</h1>
    <div class="hd-acts">
      <button class="icon-btn" id="btnHistory" title="历史记录">🕘</button>
      <button class="icon-btn" id="btnSet" title="一键看跌幅榜">⚡</button>
    </div>
  </div>

  <!-- 行2：本金条（默认一行小字，点击展开） -->
  <button class="cap-bar" id="capBar" aria-expanded="false">
    <span class="cap-bar-main">
      <span class="cap-bar-k">本金</span>
      <span class="cap-bar-v" id="capValue">—</span>
    </span>
    <span class="cap-bar-dot">·</span>
    <span class="cap-bar-main">
      <span class="cap-bar-k">最新</span>
      <span class="cap-bar-v sub" id="capTime">—</span>
    </span>
    <span class="cap-bar-ago" id="capAgo">—</span>
    <span class="cap-bar-caret">▾</span>
  </button>
  <div class="cap-detail" id="capDetail">
    <div class="cap-detail-inner">
      <div class="cap-detail-cell">
        <div class="k">记录时间</div><div class="v" id="cdTime">—</div>
      </div>
      <div class="cap-detail-cell">
        <div class="k">快照标签</div><div class="v" id="cdTag">—</div>
      </div>
      <div class="cap-detail-cell">
        <div class="k">录入项数</div><div class="v" id="cdCount">—</div>
      </div>
      <div class="cap-detail-cell">
        <div class="k">距上次</div><div class="v" id="cdSpan">—</div>
      </div>
    </div>
  </div>

  <!-- 行3：对比区间（单行） -->
  <div class="cmp-bar">
    <div class="cmp-picks">
      <select id="selFrom" class="cmp-sel" aria-label="基准快照"></select>
      <span class="cmp-arrow">→</span>
      <select id="selTo" class="cmp-sel" aria-label="当前快照"></select>
    </div>
    <div class="cmp-span" id="cmpSpan">—</div>
  </div>

  <!-- 行4：统计概览（横向滚动，点击看详情） -->
  <div class="stats" id="stats"></div>

  <!-- 行5：搜索 -->
  <div class="search-wrap">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4">
      <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
    </svg>
    <input id="search" type="text" placeholder="搜索物资名称…" />
  </div>

  <!-- 行6：筛选胶囊 + 排序 -->
  <div class="chips" id="chips">
    <button class="chip active" data-f="all">全部</button>
    <button class="chip up"    data-f="up">涨</button>
    <button class="chip down"  data-f="down">跌</button>
    <button class="chip flat"  data-f="flat">平</button>
    <button class="chip star"  data-f="fav">★</button>
    <span class="chip-sep"></span>
    <button class="chip sort"  data-s="level">等级</button>
    <button class="chip sort"  data-s="name">名称</button>
    <button class="chip sort"  data-s="price">现价</button>
    <button class="chip sort"  data-s="chg">涨跌</button>
    <button class="chip sort"  data-s="none">默认</button>
  </div>
</header>

<!-- ======================= 主体：卡片列表 ======================= -->
<div class="layout">
  <nav id="nav"></nav>
  <main id="main">
    <div class="list" id="list"></div>
  </main>
</div>

<!-- ======================= 底部条 ======================= -->
<footer>
  <div><span id="countBar">0 项</span></div>
  <div class="f-mid" id="footMid">—</div>
  <div>★ <b id="favCount">0</b></div>
</footer>

<!-- ======================= 浮层 ======================= -->
<div class="overlay" id="overlay"></div>

<!-- 历史记录抽屉（右侧） -->
<aside class="drawer" id="drawer">
  <div class="dw-head">
    <h2>历史记录</h2>
    <button class="icon-btn" id="btnCloseDrawer">✕</button>
  </div>
  <div class="dw-body">
    <div class="timeline" id="timeline"></div>
    <div class="dw-section">
      <h3>等级图例</h3>
      <div class="legend">
        <div><i class="dot lv7"></i>7级 · 流光</div>
        <div><i class="dot lv6"></i>6级 · 红</div>
        <div><i class="dot lv5"></i>5级 · 金</div>
        <div><i class="dot lv0"></i>低级 · 灰</div>
      </div>
    </div>
    <div class="dw-section">
      <h3>如何新增记录</h3>
      <div class="dw-note">
        打开 <code>js/data.js</code>，在 <code>SNAPSHOTS</code> 加一条快照信息，
        再在 <code>PRICES</code> 里加一份同名 key 的价格表即可。页面会自动识别并接入走势图。
      </div>
    </div>
  </div>
</aside>

<!-- 统计详情抽屉（底部） -->
<aside class="sheet" id="sheet">
  <div class="sh-handle"></div>
  <div class="sh-head">
    <h2 id="shTitle">—</h2>
    <button class="icon-btn" id="btnCloseSheet">✕</button>
  </div>
  <div class="sh-body" id="shBody"></div>
</aside>

<!-- 物品详情弹窗 -->
<div class="modal" id="modal">
  <div class="mo-card">
    <div class="mo-head">
      <div>
        <div class="mo-title" id="moTitle">—</div>
        <div class="mo-sub" id="moSub">—</div>
      </div>
      <button class="icon-btn" id="btnCloseModal">✕</button>
    </div>
    <div class="mo-body" id="moBody"></div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
