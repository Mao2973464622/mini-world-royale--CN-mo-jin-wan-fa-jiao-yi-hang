<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>摸金交易行 · 涨跌看板</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<!-- ======================= 顶部 ======================= -->
<header class="app-header">
  <div class="hd-row">
    <div>
      <h1>摸金交易行 · 涨跌看板</h1>
      <p class="sub">两次快照对比 · 手动记录，仅供倒卖参考</p>
    </div>
    <button class="icon-btn" id="btnHistory" title="历史记录">🕘</button>
    <button class="icon-btn" id="btnSet" title="设置">⚙</button>
  </div>

  <!-- 本金卡片 -->
  <div class="card capital">
    <div class="coin">🪙</div>
    <div class="cap-main">
      <div class="cap-label">当前本金</div>
      <div class="cap-value" id="capValue">—</div>
      <div class="cap-line"></div>
    </div>
    <div class="cap-side">
      <div class="cap-label">最新记录</div>
      <div class="cap-time" id="capTime">—</div>
      <div class="cap-ago" id="capAgo">—</div>
    </div>
  </div>

  <!-- 对比区间条 -->
  <div class="card compare">
    <div class="cmp-head">
      <span class="cmp-title">对比区间</span>
      <span class="cmp-span" id="cmpSpan">—</span>
    </div>
    <div class="cmp-body">
      <label class="cmp-slot">
        <span class="cmp-tag">基准</span>
        <select id="selFrom"></select>
      </label>
      <div class="cmp-arrow">→</div>
      <label class="cmp-slot">
        <span class="cmp-tag">当前</span>
        <select id="selTo"></select>
      </label>
    </div>
  </div>

  <!-- 统计卡 -->
  <div class="stats" id="stats"></div>

  <!-- 搜索 + 涨跌筛选 -->
  <div class="toolbar">
    <div class="search-wrap">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4">
        <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
      </svg>
      <input id="search" type="text" placeholder="搜索物资名称…" />
    </div>
    <div class="chips" id="chips">
      <button class="chip active" data-f="all">全部</button>
      <button class="chip up"    data-f="up">涨</button>
      <button class="chip down"  data-f="down">跌</button>
      <button class="chip flat"  data-f="flat">平</button>
      <button class="chip star"  data-f="fav">★</button>
    </div>
  </div>
</header>

<!-- ======================= 主体 ======================= -->
<div class="layout">
  <nav id="nav"></nav>
  <main id="main">
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th class="q-col sortable" data-sort="level" title="按等级排序"><span class="hd-dot"></span></th>
            <th class="sortable" data-sort="name">名称 <span class="arrow">↑</span></th>
            <th class="sortable r" data-sort="price">现价 <span class="arrow">↑</span></th>
            <th class="sortable r" data-sort="chg">涨跌 <span class="arrow">↑</span></th>
            <th class="star-col"></th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </main>
</div>

<!-- ======================= 底部 ======================= -->
<footer>
  <div><span id="countBar">0 项</span></div>
  <div class="f-mid" id="footMid">—</div>
  <div>已收藏 <b id="favCount">0</b></div>
</footer>

<!-- ======================= 历史记录抽屉 ======================= -->
<div class="overlay" id="overlay"></div>

<aside class="drawer" id="drawer">
  <div class="dw-head">
    <h2>历史记录</h2>
    <button class="icon-btn" id="btnCloseDrawer">✕</button>
  </div>
  <div class="dw-body">
    <div class="timeline" id="timeline"></div>

    <div class="dw-section">
      <h3>快照总览</h3>
      <div class="dw-note">
        每次记录 = 一个快照。在上方时间轴点「设为基准 / 设为当前」即可切换对比区间。
      </div>
      <div class="dw-note dim">
        新增记录：打开 <code>js/data.js</code>，在 <code>SNAPSHOTS</code> 和 <code>PRICES</code> 里各加一条即可，页面会自动识别。
      </div>
    </div>

    <div class="dw-section">
      <h3>等级图例</h3>
      <div class="legend">
        <div><i class="dot lv7"></i>7级 · 流光</div>
        <div><i class="dot lv6"></i>6级 · 极品</div>
        <div><i class="dot lv5"></i>5级 · 完美</div>
        <div><i class="dot lv0"></i>低级 · 灰</div>
      </div>
    </div>
  </div>
</aside>

<!-- ======================= 物品详情弹窗 ======================= -->
<div class="modal" id="modal">
  <div class="mo-card">
    <div class="mo-head">
      <div>
        <div class="mo-title" id="moTitle">—</div>
        <div class="mo-sub" id="moSub">—</div>
      </div>
      <button class="icon-btn" id="btnCloseModal">✕</button>
    </div>
    <div class="mo-body" id="moBody"></div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
